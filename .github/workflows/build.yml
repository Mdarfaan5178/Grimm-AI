name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -f "Grimm-AI/package.json" ]; then
            cd Grimm-AI && npm install
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          if [ -d "Grimm-AI/android" ]; then
            cd Grimm-AI/android
          elif [ -d "android" ]; then
            cd android
          fi

          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 7
          
