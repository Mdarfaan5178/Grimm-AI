name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          if [ -f "package.json" ]; then
            npm install
          elif [ -f "Grimm-AI/package.json" ]; then
            cd Grimm-AI && npm install
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json if missing
        run: |
          TARGET_DIR=""
          if [ -d "Grimm-AI/app" ]; then
            TARGET_DIR="Grimm-AI/app"
          elif [ -d "app" ]; then
            TARGET_DIR="app"
          fi

          if [ -n "$TARGET_DIR" ] && [ ! -f "$TARGET_DIR/google-services.json" ]; then
            echo "Creating a placeholder google-services.json to allow build to pass..."
            echo '{
              "project_info": {
                "project_number": "1234567890",
                "project_id": "grimm-ai-placeholder",
                "storage_bucket": "grimm-ai-placeholder.appspot.com"
              },
              "client": [{
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:placeholder",
                  "android_client_id": "placeholder"
                },
                "oauth_client": [],
                "services": {
                  "analytics_service": { "status": 1 },
                  "app_invite_service": { "status": 1 },
                  "ads_service": { "status": 2 }
                }
              }],
              "configuration_version": "1"
            }' > "$TARGET_DIR/google-services.json"
          fi

      - name: Build APK with Gradle
        run: |
          if [ -d "Grimm-AI/android" ]; then
            cd Grimm-AI/android
          elif [ -d "android" ]; then
            cd android
          fi

          if [ ! -f "./gradlew" ]; then
            gradle wrapper
          fi

          chmod +x gradlew
          # Using --info so we can see the exact error output line right before failure
          ./gradlew clean assembleDebug --no-daemon --info

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 7
          
