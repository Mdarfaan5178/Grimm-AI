name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create google-services.json
        run: |
          APP_DIR=""
          if [ -d "app" ]; then
            APP_DIR="app"
          elif [ -d "Grimm-AI/app" ]; then
            APP_DIR="Grimm-AI/app"
          elif [ -d "Grimm-AI/Grimm-AI/app" ]; then
            APP_DIR="Grimm-AI/Grimm-AI/app"
          else
            mkdir -p app/src/main
            APP_DIR="app"
          fi

          echo "Placing google-services.json into $APP_DIR"
          echo '{
            "project_info": {
              "project_number": "1234567890",
              "project_id": "grimm-ai",
              "storage_bucket": "grimm-ai.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef123456",
                  "android_client_info": {
                    "package_name": "com.aistudio.grimmai.kznxqt"
                  }
                },
                "oauth_client": [],
                "services": {
                  "analytics_service": { "status": 1 },
                  "app_invite_service": { "status": 1 },
                  "ads_service": { "status": 2 }
                }
              }
            ],
            "configuration_version": "1"
          }' > "$APP_DIR/google-services.json"

      - name: Build APK with Gradle
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          elif [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          elif [ -f "Grimm-AI/gradlew" ]; then
            cd Grimm-AI
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          elif [ -f "Grimm-AI/Grimm-AI/gradlew" ]; then
            cd Grimm-AI/Grimm-AI
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            gradle wrapper
            chmod +x gradlew
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          retention-days: 7
          
